<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dashboard local</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .chart { width:100%; max-width:700px; margin:1rem auto; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <a href="../index.html" class="brand-link">
          <img src="../assets/images/logo.png" alt="Ambiá Consultoria" class="brand-logo"/>
        </a>
        <div class="brand-text">
          <h1 class="brand-title">Ambiá</h1>
          <p class="brand-sub">Consultoria e Engenharia</p>
        </div>
      </div>

      <nav class="main-nav">
        <a href="../index.html">Home</a>
        <a href="./">Dashboards</a>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <h2>Gráfico de Vistoria</h2>
      <div class="chart"><canvas id="chart1"></canvas></div>
    </section>
  </main>

  <script>
    // Cria um gráfico de barras simples como exemplo
    const ctx = document.getElementById('chart1');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['PCS', 'PGA'],
        datasets: [{ label: 'Visitas de Campo (exemplo)', data: [12, 7], backgroundColor: ['#2c3e50','#3498db'] }]
      },
      options: { responsive: true }
    });
  </script>
</body>
</html>
