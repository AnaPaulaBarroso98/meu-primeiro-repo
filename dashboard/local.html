<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dashboard local</title>
  <link rel="stylesheet" href="../css/styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .chart { width:100%; max-width:700px; margin:1rem auto; }
  </style>
</head>
<body>
  <header>
    <h1>Dashboard (local)</h1>
    <nav><a href="../index.html">Home</a> | <a href="../dashboard/">Área de Dashboards</a></nav>
  </header>
  <main>
    <section>
      <h2>Gráfico de Vistoria</h2>
      <div class="chart"><canvas id="chart1"></canvas></div>
    </section>
  </main>

  <script>
    // Cria um gráfico de barras simples como exemplo
    const ctx = document.getElementById('chart1');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['PCS', 'PGA'],
        datasets: [{ label: 'Visitas de Campo (exemplo)', data: [12, 7], backgroundColor: ['#2c3e50','#3498db'] }]
      },
      options: { responsive: true }
    });
  </script>
</body>
</html>
